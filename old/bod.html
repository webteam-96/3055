    <script>
  function cleanText(text) {
    if (!text || typeof text !== "string") return "";
    return text.trim().replace(/\s+/g, ' ');
  }

  let allClubs = []; // store clubs for searching

  async function fetchData() {
    const url = "https://rotaryindiaapi.rosteronwheels.com/api/District/Get_Clubs_BOD";
    const requestData = {
      groupId: "31685",
      financialyear: "2026-2027"
    };

    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestData)
      });

      if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);

      const data = await response.json();
      allClubs = data.ClubListResult.Clubs || [];
      renderClubs(allClubs);

    } catch (error) {
      document.getElementById("output").innerHTML =
        `<p style="color: red;">Error: ${error.message}</p>`;
    }
  }

  // 🔹 CLEAN GETTER — NO N/A RETURNED
  const get = (v) => (v && v !== "null" ? cleanText(v) : "");

  const getImg = (v) => (v && v !== "null" ? v : "../assets/images/dummy.jpg");


  function renderClubs(clubs) {
    let outputHTML = "";

    clubs.forEach(club => {

      // AG Fields
      const agName = get(club.AG_Name);
      const agMobile = get(club.AG_MobileNumber);
      const agEmail = get(club.AG_EmailID);
      const agDOB = get(club.AG_DOB);
      const agPhoto = getImg(club.AG_Photo);

      // President Fields
      const presidentName = get(club.President_member_name);
      const presidentEmail = get(club.President_member_email_id);
      const presidentMobile = get(club.President_member_mobile_no);
      const presidentPhoto = getImg(club.President_Profile_Photo);

      // Secretary Fields
      const secretaryName = get(club.Secreatary_member_name);
      const secretaryEmail = get(club.Secreatary_email_id);
      const secretaryMobile = get(club.Secreatary_mobile_no);
      const secretaryPhoto = getImg(club.Secreatary_Profile_Photo);

      // Club Name
      const clubName = get(club.clubName);

      // Skip club ONLY if president AND secretary both missing
      if (!presidentName && !secretaryName) return;

      const qrCodeLink =
        `https://3170directory.rizones4567.org/club-details.html?groupId=${club.grpID}`;

      // ⭐ HTML BLOCK UNCHANGED ⭐
      outputHTML += `
      <section class="about-section">
        <div class="auto-container">
          <div class="sec-title1 text-center">
            <h2>${clubName}</h2>
          </div>

          <div class="row clearfix align-items-center justify-content-center">
            <div class="col-md-12 col-12 mb-3">
              <div class="executive-card4" style="background-color:#2F4366;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.1);">
                <div class="card-header" style="background-color:#8D9FBE;color:#000;text-align:center;padding:10px;font-weight:400;border-radius: 0 0 10px 10px;font-size:20px; margin: auto; width: 80%;">
                  ASSISTANT GOVERNOR
                </div>
                <div class="card-body">
                  <div class="row">
                    <div class="col-md-3 col-12 ag-image">
                      <img src="${agPhoto}" class="pro-img" alt="assistant-governor" />
                    </div>
                    <div class="col-md-9 col-12">
                      <div class="row">
                        <div class="col-md-7 col-12"><div class="pro-name filed"><span>Name:</span> ${agName}</div></div>
                        <div class="col-md-4 col-12"><div class="pro-name filed"><span>Mobile No.:</span> ${agMobile}</div></div>
                        <div class="col-md-7 col-12"><div class="pro-name filed"><span>Email:</span> ${agEmail}</div></div>
                        <div class="col-md-4 col-12"><div class="pro-name filed"><span>DOB.:</span> ${agDOB}</div></div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="row g-4 align-items-center justify-content-center">

            <!-- PRESIDENT -->
            <div class="col-xxl-5 col-xl-5 col-md-5 col-12">
              <div class="executive-card" style="background-color: #E59E2C; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <div class="card-header" style="background-color: #FFE8C4; color: #000; text-align: center; padding: 10px; font-weight: 400; border-radius: 0 0 10px 10px; font-size: 18px;">PRESIDENT</div>
                <div class="card-body p-2 m-2">
                  <div class="row align-items-center">
                    <div class="col-md-5 col-12 text-center mb-2"><img src="${presidentPhoto}" class="pro-img2" alt="President" /></div>
                    <div class="col-md-7 col-12">
                      <div class="pro-name filed2"><span>Name:</span> ${presidentName}</div>
                      <div class="pro-name filed2"><span>Email:</span> ${presidentEmail}</div>
                      <div class="pro-name filed"><span>Mobile No.:</span> ${presidentMobile}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- QR -->
            <div class="col-xxl-2 col-xl-2 col-md-2 col-12 text-center">
              <div class="executive-card p-3 mb-2" style="background-color: #2F4366; border-radius: 10px;">
                <div class="btn-box mb-3"><a href="${qrCodeLink}" class="theme-btn btn-one dist-btn">TO KNOW MORE SCAN NOW</a></div>
                <canvas id="qr-${club.grpID}" style="margin-top: 20px;"></canvas>
              </div>
            </div>

            <!-- SECRETARY -->
            <div class="col-xxl-5 col-xl-5 col-md-5 col-12">
              <div class="executive-card" style="background-color: #E59E2C; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                <div class="card-header" style="background-color: #FFE8C4; color: #000; text-align: center; padding: 10px; font-weight: 400; border-radius: 0 0 10px 10px; font-size: 18px;">SECRETARY</div>
                <div class="card-body p-2 m-2">
                  <div class="row align-items-center">
                    <div class="col-md-5 col-12 text-center mb-2"><img src="${secretaryPhoto}" class="pro-img2" alt="Secretary" /></div>
                    <div class="col-md-7 col-12">
                      <div class="pro-name filed2"><span>Name:</span> ${secretaryName}</div>
                      <div class="pro-name filed2"><span>Email:</span> ${secretaryEmail}</div>
                      <div class="pro-name filed"><span>Mobile No.:</span> ${secretaryMobile}</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

          </div>
        </div>
      </section>`;
    });

    document.getElementById("output").innerHTML = outputHTML;

    // QR generation
    clubs.forEach(club => {
      const canvas = document.getElementById(`qr-${club.grpID}`);
      if (canvas) {
        new QRious({
          element: canvas,
          value: `https://3170directory.rizones4567.org/club-details.html?groupId=${club.grpID}`,
          size: 100
        });
      }
    });
  }

  // Search Functionality
  document.getElementById("search-btn").addEventListener("click", function () {
    const query = document.getElementById("search-input").value.toLowerCase().trim();

    const filtered = allClubs.filter(club =>
      (club.President_member_name || "").toLowerCase().includes(query) ||
      (club.Secreatary_member_name || "").toLowerCase().includes(query) ||
      (club.clubName || "").toLowerCase().includes(query) ||
      (club.President_member_mobile_no || "").toLowerCase().includes(query) ||
      (club.Secreatary_mobile_no || "").toLowerCase().includes(query) ||
      (club.AG_Name || "").toLowerCase().includes(query)
    );

    renderClubs(filtered);
    document.getElementById("search-input").blur();
  });

  fetchData();
</script>
