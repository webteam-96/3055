.stylish-arrow {

    display: flex;
    align-items: center;

}

/* Create arrow with borders */

    content: '';
    width: 10px;
    height: 10px;
    border-right: 2px solid #fff;
    border-bottom: 2px solid #fff;
    transform: rotate(45deg); /* Down arrow */
    transition: transform 0.3s ease;

}

/* Rotate arrow up when accordion is open */

         <script>
            document.addEventListener("DOMContentLoaded", function () {
                const urlParams = new URLSearchParams(window.location.search);
                const groupId = urlParams.get("groupId");
                const financialyear = "2026-2027";
            
                const cardColors = ['#372616', '#E59E2C', '#2F4366', '#2F5755'];
                const headerColors = ['#E8D8CE', '#FFE8C4', '#8D9FBE', '#88BAB5'];
            
                // === FETCH CLUB DETAILS ===
                fetch("https://rotaryindiaapi.rosteronwheels.com/api/District/Get_Clubs_BOD_Details", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ groupId, financialyear })
                })
                .then(response => response.json())
                .then(data => {
                    const club = data?.ClubListResult?.FinalResult;
                    if (!club || !club.BasicInfo || club.BasicInfo.length === 0) {
                        document.getElementById("clubInfo").innerHTML = "<p>Error: No club information available.</p>";
                        return;
                    }
            
                    const basicInfo = club.BasicInfo[0];
                    const clubName = basicInfo.Club_Name || "Club Name Not Available";
                    document.getElementById("clubName").innerText = clubName;
            
                    // === ASSISTANT GOVERNOR SECTION ===
                    let ag = club.AG;
                    if (Array.isArray(ag)) ag = ag[0];
            
                    if (ag && (ag.Name || ag.Designation)) {
                        const agHtml = `
                        <div class="row clearfix align-items-center justify-content-center">
                            <div class="col-md-12 col-12 mb-3">
                                <div class="executive-card4" style="background-color:#2F4366;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,0.1);">
                                    <div class="card-header" style="background-color:#8D9FBE;color:#000;text-align:center;padding:10px;font-weight:400;border-radius:0 0 10px 10px;font-size:20px; width: 80%; margin: auto;">
                                        ${ag.Designation || 'Assistant Governor'}
                                    </div>
                                    <div class="card-body">
                                        <div class="row">
                                            <div class="col-md-3 col-12 ag-image">
                                                <img src="${club.President_Profile_Photo1 || '../assets/images/dummy.jpg'}" class="pro-img" alt="AG" />
                                            </div>
                                            <div class="col-md-9 col-12">
                                                <div class="row">
                                                    <div class="col-md-7 col-12"><div class="pro-name filed"><span>Name:</span> ${ag.Name || ''}</div></div>
                                                    <div class="col-md-4 col-12"><div class="pro-name filed"><span>Mobile No.:</span> ${ag.Mobile_number || ''}</div></div>
                                                    <div class="col-md-7 col-12"><div class="pro-name filed"><span>Email:</span> ${ag.Emailid || ''}</div></div>
                                                    <div class="col-md-4 col-12"><div class="pro-name filed"><span>DOB:</span> ${formatDateToDDMM(ag.member_date_of_birth)}</div></div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                        document.getElementById("agLeader").innerHTML = agHtml;
                    }
            
                    // === CLUB INFO ===
                    document.getElementById("clubInfo").innerHTML = `
                        <div class="auto-container">
                            <div class="row justify-content-center">
                                <div class="col-md-3 col-12"><span><strong>Club ID:</strong> ${basicInfo.Club_ID || ""}</span></div>
                                <div class="col-md-3 col-12"><span><strong>Charter Date:</strong> ${formatDateToDDMM(basicInfo.Charter_Date)}</span></div>
                                <div class="col-md-6 col-12 member"><span><strong>Membership:</strong> ${basicInfo.Membership || ""}</span></div>
                            </div>
                        </div>
                    `;
            
                    // === PRESIDENT SECTION ===
                    const president = club.President?.[0] || {};
                    const presidentHtml = renderPresidentCard(president, clubName);
            
                    // === SECRETARY SECTION ===
                    const secretary = club.Secretary?.[0] || {};
                    const secretaryHtml = renderSecretaryCard(secretary, clubName);
            
                    // Combine and display
                    const leadersHtml = `
                        <div class="auto-container">
                            <div class="row clearfix align-items-center justify-content-center">
                                ${presidentHtml}
                                ${secretaryHtml}
                            </div>
                        </div>`;
                    document.getElementById("clubLeaders").innerHTML = leadersHtml;
            
                    // === BOARD OF DIRECTORS ===
                    let bodHtml = `
                        <div class="accordion mt-4" id="bodAccordion">
                            <div class="accordion-item">
                                <h2 class="accordion-header" id="headingBod">
                                    <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseBod" aria-expanded="false" aria-controls="collapseBod" style="width: 350px; padding: 20px; margin: 20px auto; display: block; text-align: center;">
                                        <span>Board of Directors</span>
                                    </button>
                                </h2>
                                <div id="collapseBod" class="accordion-collapse collapse" aria-labelledby="headingBod" data-bs-parent="#bodAccordion">
                                    <div class="accordion-body">
                                        <div class="row justify-content-center">`;
            
                    if (club.BOD?.length > 0) {
                        club.BOD.forEach((member, index) => {
                            const cardColor = cardColors[index % 4];
                            const headerColor = headerColors[index % 4];
                            bodHtml += `
                            <div class="col-xxl-6 col-xl-6 col-md-6 col-12 mb-3">
                                <div class="executive-card2" style="background-color: ${cardColor}; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                    <div class="card-header" style="background-color: ${headerColor}; width: 80%; margin: auto; color: #000; text-align: center; padding: 10px; font-weight: 400; border-radius: 0 0 10px 10px; font-size: 18px;">
                                        ${member.Designation || 'Board Member'}
                                    </div>
                                    <div class="card-body p-3 m-2">
                                        <div class="row align-items-center">
                                            <div class="col-md-4 col-12 text-center mb-2">
                                                <img src="${member.member_profile_photo_path || '../assets/images/dummy.jpg'}" class="pro-img" alt="Member" />
                                            </div>
                                            <div class="col-md-8 col-12">
                                                <div class="pro-name filed"><span>Name:</span> ${member.Name || ''}</div>
                                                <div class="pro-name filed"><span>Club:</span> ${member.ClubName || clubName}</div>
                                                <div class="row justify-content-between">
                                                    <div class="col-7">
                                                        <div class="pro-name filed"><span>M:</span> ${member.Mobile_number || ''}</div>
                                                    </div>
                                                    <div class="col-5">
                                                        <div class="pro-name filed"><span>DOB:</span> ${formatDateToDDMM(member.member_date_of_birth)}</div>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="col-9"><div class="pro-name filed"><span>Email:</span> ${member.Emailid || ''}</div></div>
                                            <div class="col-3"><div class="pro-name filed"><span>DOA:</span> ${formatDateToDDMM(member.member_date_of_wedding)}</div></div>
                                        </div>
                                        <div class="row">
                                            <div class="col-12"><div class="pro-name filed address-line"><span>Res. Address:</span> ${member.address || ''}</div></div>
                                        </div>
                                    </div>
                                </div>
                            </div>`;
                        });
                    } else {
                        bodHtml += `<p>No Board of Directors available.</p>`;
                    }
            
                    bodHtml += `</div></div></div></div></div>`;
                    document.getElementById("officeBearers").innerHTML = bodHtml;
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.getElementById("clubInfo").innerHTML = "<p>Error loading club details.</p>";
                });
            
                // === MEMBERS SECTION ===
                const container = document.getElementById("clubMembers");
                if (!groupId) {
                    container.innerHTML = "<p>Group ID not found in URL.</p>";
                    return;
                }
            
                const requestData = { grpID: groupId, searchText: "", financialyear: financialyear };
            
                fetch("https://rotaryindiaapi.rosteronwheels.com/api/FindClub/GetClubMembers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(requestData)
                })
                .then(response => response.json())
                .then(data => {
                    let members = data?.TBMemberList?.Result?.Table;
                    if (members && !Array.isArray(members)) members = [members];
            
                    if (!Array.isArray(members) || members.length === 0) {
                        container.innerHTML = "<p>No members found.</p>";
                        return;
                    }
            
                    let html = `
                    <div class="accordion mt-4" id="membersAccordion">
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="headingMembers">
                                <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapseMembers" aria-expanded="false" aria-controls="collapseMembers" style="width: 350px; padding: 20px; margin: 20px auto; display: block; text-align: center;">
                                    <span>Members</span>
                                </button>
                            </h2>
                            <div id="collapseMembers" class="accordion-collapse collapse" aria-labelledby="headingMembers" data-bs-parent="#membersAccordion">
                                <div class="accordion-body">
                                    <div class="row">`;
            
                    members.forEach((member, index) => {
                        const cardColor = cardColors[index % cardColors.length];
                        const headerColor = headerColors[index % headerColors.length];
                        const imgSrc = member.pic || '../assets/images/dummy.jpg';
                        const name = member.memberName || member.MemberName || '';
                        const mobile = member.membermobile || member.MemberMobile || '';
                        const designation = member.designation || member.Designation || 'Rotarian';
            
                        html += `
                        <div class="col-xxl-6 col-xl-6 col-md-6 col-12 mb-3">
                            <div class="executive-card3" style="background-color: ${cardColor}; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
                                <div class="card-header" style="background-color: ${headerColor}; width: 80%; margin: auto; color: #000; text-align: center; padding: 10px; font-weight: 400; border-radius: 0 0 10px 10px; font-size: 18px;">
                                    ${designation}
                                </div>
                                <div class="card-body p-3 m-2">
                                    <div class="row align-items-center">
                                        <div class="col-md-4 col-12 text-center mb-2">
                                            <img src="${imgSrc || '../assets/images/dummy.jpg'}" class="pro-img" alt="${name}" onerror="this.onerror=null;this.src='../assets/images/dummy.jpg';" />
                                        </div>
                                        <div class="col-md-8 col-12">
                                            <div class="pro-name filed"><span>Name:</span> ${name}</div>
                                            <div class="pro-name filed"><span>Club:</span> ${member.groupName || ''}</div>
                                            <div class="row justify-content-between">
                                                <div class="col-7"><div class="pro-name filed"><span>M:</span> ${mobile}</div></div>
                                                <div class="col-5"><div class="pro-name filed"><span>DOB:</span> ${formatDateToDDMM(member.MemberDOB)}</div></div>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-9"><div class="pro-name filed"><span>Email:</span> ${member.MemberEmail || ''}</div></div>
                                        <div class="col-3"><div class="pro-name filed"><span>DOA:</span> ${formatDateToDDMM(member.MemberDOA)}</div></div>
                                    </div>
                                    <div class="row">
                                        <div class="col-12"><div class="pro-name filed address-line"><span>Res. Address:</span> ${member.MemberAddress || ''}</div></div>
                                    </div>
                                </div>
                            </div>
                        </div>`;
                    });
            
                    html += `</div></div></div></div></div>`;
                    container.innerHTML = html;
                })
                .catch(error => {
                    console.error("Error loading members:", error);
                    if (container) container.innerHTML = "<p>Error loading data.</p>";
                });
            
                // === HELPER FUNCTIONS ===
                function cleanText(text) {
                    return text?.replace(/(<([^>]+)>)/gi, "") ?? "";
                }
            
                function formatDateToDDMM(dateStr) {
                    if (!dateStr) return "";
                    dateStr = dateStr.replace(/(\d+)(st|nd|rd|th)/i, "$1");
                    let date = new Date(dateStr);
                    if (!isNaN(date)) {
                        const day = String(date.getDate()).padStart(2, '0');
                        const month = String(date.getMonth() + 1).padStart(2, '0');
                        return `${day}/${month}`;
                    }
                    const parts = dateStr.trim().split(' ');
                    if (parts.length === 2) {
                        const day = parts[0].padStart(2, '0');
                        const monthNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
                        const monthIndex = monthNames.findIndex(m => m.toLowerCase() === parts[1].toLowerCase());
                        if (monthIndex >= 0) return `${day}/${String(monthIndex+1).padStart(2,'0')}`;
                    }
                    return dateStr;
                }
            
                // === PRESIDENT & SECRETARY FUNCTIONS ===
                function renderPresidentCard(person, clubName) {
                    return `
                    <div class="col-xxl-6 col-xl-6 col-md-6 col-12 mb-3">
                        <div class="executive-card1" style="background-color: #E59E2C; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">
