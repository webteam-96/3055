    <script>
        const headerColors = ['#E8D8CE', '#FFE8C4', '#8D9FBE', '#88BAB5'];
        const bodyColors = ['#372616', '#E59E2C', '#2F4366', '#2F5755'];

        // Parse URL hash: #committee-name or #committee-name/zone-name
        function parseURL() {
            const hash = window.location.hash.substring(1); // Remove #
            const parts = hash.split('/');
            return {
                committeeSlug: parts[0] || '',
                zoneSlug: parts[1] || ''
            };
        }

        // Find committee by slug
        function findCommitteeBySlug(slug) {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key.startsWith('committee_')) {
                    const data = JSON.parse(localStorage.getItem(key));
                    if (data.slug === slug) {
                        return data;
                    }
                }
            }
            return null;
        }

        function createSlug(name) {
            return name.toLowerCase()
                .replace(/[^a-z0-9]+/g, '-')
                .replace(/^-|-$/g, '');
        }

        // function updateBreadcrumb(committeeName, zoneName = null) {

        //     if (zoneName) {

        //             <a href="sub_committee.html#${urlParts.committeeSlug}">${committeeName}</a>
        //             <span>></span>

        //         `;

        function formatDayMonth(dateStr) {
            if (!dateStr) return '';
            dateStr = dateStr.trim();
            const parts = dateStr.split('/');
            if (parts.length < 2) return '';
            const day = parts[0].padStart(2, '0');
            const month = parts[1].padStart(2, '0');
            return `${day}/${month}`;
        }

        function clearAllContent() {
            // Clear all containers
            document.getElementById('cards-container').innerHTML = '';
            document.getElementById('sub-committees-container').innerHTML = '';
            
            // Hide all sections
            document.getElementById('members-section').style.display = 'none';
            document.getElementById('section-divider').style.display = 'none';
            document.getElementById('sub-committees-section').style.display = 'none';
            //document.getElementById('breadcrumb').style.display = 'none';
        }

        function displaySubCommittees(subCommittees, committeeSlug) {
    const container = document.getElementById('sub-committees-container');
    const section = document.getElementById('sub-committees-section');

    if (!subCommittees || subCommittees.length === 0) {
        section.style.display = 'none';
        return;
    }

    section.style.display = 'block';
    container.innerHTML = '';

    // NEW color array
    const colors = ['#372616', '#2F4366', '#E59E2C', '#17458F'];

    subCommittees.forEach((subCommittee, index) => {
        const headerColor = colors[index % colors.length]; // << replaced
        const zoneSlug = createSlug(subCommittee.name);

        const card = document.createElement('div');
        card.classList.add('col-md-4', 'col-12');

        card.innerHTML = `
            <a class="avenu-crd" href="sub_committee.html#${committeeSlug}/${zoneSlug}"
                style="background-color: ${headerColor};">
                <div class="cat-text">${subCommittee.name}</div>
            </a>
        `;

        container.appendChild(card);
    });
}


        function displayMembers(records) {
            const container = document.getElementById('cards-container');
            const section = document.getElementById('members-section');
            
            if (records.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';

            records.sort((a, b) => {
                const clubA = (a.ClubName || '').toLowerCase();
                const clubB = (b.ClubName || '').toLowerCase();
                return clubA.localeCompare(clubB);
            });

            container.innerHTML = '';

            records.forEach((record, index) => {
                const headerColor = headerColors[index % headerColors.length];
                const bodyColor = bodyColors[index % bodyColors.length];

                const cardData = {
                    name: record.name || '',
                    mobileNumber: record.MobileNumber || '',
                    email: record.MailID || '',
                    districtDesignation: record.DistrictDesignation || '',
                    clubName: record.ClubName || '',
                    img: record.img || '../assets/images/dummy.jpg',
                };

                const fullDesignationMap = {
                    'ZAC': 'Zonal Avenue Chair',
                    'GAH': 'Group Avenue Head',
                    'ZCC': 'Zonal Co-Chair',
                    'ZDC': 'Zonal District Chair'
                };

                const designationKey = (cardData.districtDesignation || '').substring(0, 3);
                if (fullDesignationMap[designationKey]) {
                    cardData.districtDesignation = `${fullDesignationMap[designationKey]} (${designationKey})`;
                }

                const address = record.Address?.trim() || '';
                const Keywords = record.Keywords?.trim() || '';
                const doa = formatDayMonth(record.DOA);
                const dob = formatDayMonth(record.DOB);
                const RotaryID = record.RotaryID?.trim() || '';
                const Bloodgrp = record.Bloodgrp || '';
                const spousname = record.SpouseName || '';
                const spousnumber = record.SpouseMobileNumber || '';

                const card = document.createElement('div');
                card.classList.add('col-xxl-6', 'col-xl-6', 'col-md-6', 'col-12');

                card.innerHTML = `
                    <div class="executive-card" style="background-color: ${bodyColor}; min-height: 97%; ">
                        <div class="card-header" style="background-color: ${headerColor};">
                            ${cardData.districtDesignation}
                        </div>
                        <div class="card-body p-3 m-2">
                            <div class="row align-items-center">
                                <div class="col-md-4 col-12 text-center mb-2">
                                    <img src="${cardData.img}" onerror="this.onerror=null;this.src='../assets/images/dummy.jpg';" alt="Profile Image" class="pro-img" />
                                </div>
                                <div class="col-md-8">
                                    <div class="pro-name filed"><span>Name:</span> ${cardData.name}</div>
                                    <div class="pro-name filed"><span>Club:</span> ${cardData.clubName}</div>
                                    <div class="row justify-content-between">
                                        <div class="col-7">
                                            <div class=" pro-name filed"><span>M:</span> ${cardData.mobileNumber}</div>
                                        </div>
                                        <div class="col-5">
                                            <div class=" pro-name filed"><span>DOB:</span> ${dob}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-9">
                                    <div class=" pro-name filed"><span>Email:</span> ${cardData.email}</div>
                                </div>
                                <div class="col-3">
                                    <div class="pro-name filed"><span>DOA:</span> ${doa}</div>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-12">
                                    <div class="pro-name filed address-line"><span>Res. Address:</span> ${address}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        }

        function loadPage() {
            // ALWAYS clear all content first before loading new content
            clearAllContent();
            
            const urlParts = parseURL();
            const committee = findCommitteeBySlug(urlParts.committeeSlug);

            if (!committee) {
                window.location.href = 'index.html';
                return;
            }

            // Fetch committee data
            fetch('https://rotaryindiaapi.rosteronwheels.com/api/DistrictCommittee/districtCommitteeDetails/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    DistrictCommitteID: committee.id,
                    groupID: '31685',
                }),
            })
            .then(response => response.json())
            .then(data => {
                const result = data.TBDistrictCommitteeDetailsResult?.Result;
                const subCommittees = result?.district_sub_Committee || [];
                const subCommitteeDetailsList = result?.district_sub_Committee_Details_list || [];
                const directMembers = result?.districtCommitteeWithoutCatList || [];

                // If viewing a specific zone - ONLY SHOW MEMBERS
                if (urlParts.zoneSlug) {
                    const zone = subCommittees.find(z => createSlug(z.name) === urlParts.zoneSlug);
                    if (zone) {
                        document.getElementById('dynamic-title').textContent = zone.name;
                        //updateBreadcrumb(committee.name, zone.name);
                        
                        const filteredMembers = subCommitteeDetailsList.filter(
                            member => member.fk_District_sub_Committee_id === zone.pk_District_sub_Committee_id
                        );
                        
                        // ONLY show members
                        displayMembers(filteredMembers);
                    }
                }
                // Viewing main committee
                else {
                    document.getElementById('dynamic-title').textContent = committee.name;
                    //updateBreadcrumb(committee.name);

                    if (directMembers.length > 0 && subCommittees.length > 0) {
                        displayMembers(directMembers);
                        document.getElementById('section-divider').style.display = 'block';
                        displaySubCommittees(subCommittees, urlParts.committeeSlug);
                    } else if (subCommittees.length > 0) {
                        displaySubCommittees(subCommittees, urlParts.committeeSlug);
                    } else {
                        displayMembers(directMembers);
                    }
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                document.getElementById('cards-container').innerHTML = "<p class='text-danger text-center'>Failed to load data.</p>";
            });
        }

        // Load page on hash change
        window.addEventListener('hashchange', loadPage);
        
        // Initial load
        loadPage();
    </script>
