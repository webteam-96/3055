        <script>
            const headerColors = ['#f97316', '#2563eb', '#16a34a', '#FAA61F'];
            const bodyColors = ['#FFCD9E', '#dbeafe', '#d1fae5', '#fef9c3'];
        
            // Fetch and render member cards
            function fetchMemberCards() {
                fetch('https://rotaryindiaapi.rosteronwheels.com/api/DistrictCommittee/districtCommitteeList', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        groupID: '31685',
                        searchText: '',
                        yearfilter: '2025-2026',
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    const container = document.getElementById("cards-container");
                    const members = data?.TBDistrictCommitteeResult?.Result?.districtCommitteeWithoutCatList || [];
        
                    if (members.length === 0) {
                        container.innerHTML = "<p>No members found.</p>";
                        return;
                    }
        
                    members.forEach((member, index) => {
                        const headerColor = headerColors[index % 4];
                        const bodyColor = bodyColors[index % 4];
        
                        const card = document.createElement("div");
                        card.classList.add("col-xxl-6", "col-xl-6", "col-md-6", "col-12");
        
                        const designation = member.DistrictDesignation || 'Member';
                        const name = member.name || 'N/A';
                        const club = member.ClubName || 'N/A';
                        const classification = member.classification || 'N/A';
                        const mobile = member.MobileNumber || 'N/A';
                        const blood = member.BloodGroup || '';
                        const email = member.MailID || 'N/A';
                        const address = member.Address || 'N/A';
                        const dob = member.DOB || '';
                        const doa = member.DOA || '';
                        const rid = member.RotaryID || 'N/A';
                        const img = member.img || '../assets/images/dummy.jpg';
        
                        const cardHTML = `
                            <div class="executive-card" style="background-color: ${bodyColor}; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px;">
                                <div class="card-header" style="background-color: ${headerColor}; color: white; text-align: center; padding: 10px; font-weight: bold; border-radius: 10px 10px 0 0; font-size: 18px;">
                                    ${designation}
                                </div>
                                <div class="card-body p-3 m-2">
                                    <div class="row align-items-center">
                                        <div class="col-md-4 col-12 text-center mb-2">
                                            <img src="${img}" alt="Profile Image" class="pro-img"/>
                                        </div>
                                        <div class="col-md-8 col-12">
                                            <div class="pro-name filed"><span>Name:</span> ${name}</div>
                                            <div class="pro-name filed"><span>Club:</span> ${club}</div>
                                            <div class="pro-name filed"><span>Classification:</span> ${classification}</div>
                                        </div>
                                    </div>
                                    <hr>
                                    <div class="row">
                                        <div class="col-6 pro-name filed"><span>M:</span> ${mobile}</div>
                                        <div class="col-6 pro-name filed"><span>Blood Group:</span> ${blood}</div>
                                        <div class="col-12 pro-name filed"><span>Email:</span> ${email}</div>
                                        <div class="col-12 pro-name filed"><span>Address:</span> ${address}</div>
                                    </div>
                                    <div class="row mt-2">
                                        <div class="col-4 pro-name filed"><span>DOB:</span> ${dob}</div>
                                        <div class="col-4 pro-name filed"><span>W.A:</span> ${doa}</div>
                                        <div class="col-4 pro-name filed "><span>RI:</span> ${rid}</div>
                                    </div>
                                </div>
                            </div>`;
        
                        card.innerHTML = cardHTML;
                        container.appendChild(card);
                    });
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.getElementById("cards-container").innerHTML = "<p>Failed to load data.</p>";
                });
            }
        
            // Fetch and render committee list
            function fetchCommitteeList() {
                fetch('https://rotaryindiaapi.rosteronwheels.com/api/DistrictCommittee/districtCommitteeList', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        groupID: '31685',
                        searchText: '',
                        yearfilter: '2026-2027',
                    }),
                })
                .then(response => response.json())
                .then(data => {
                    if (data.TBDistrictCommitteeResult?.Result?.districtCommitteeWithCatList) {
                        let committeeListHtml = '';
                        const colors = ['#009fb4', '#179448', '#b37eb5', '#ed721d'];
        
                        data.TBDistrictCommitteeResult.Result.districtCommitteeWithCatList.forEach((committee, index) => {
                            const bgColor = colors[index % colors.length];
        
                            committeeListHtml += `
                                <div class="col-md-4 col-12">
                                    <a class="avenu-crd" href="committee-details.html?committeeID=${committee.Fk_DistrictCommitteeID}&title=${encodeURIComponent(committee.name)}" style="background-color: ${bgColor};">
                                        <div class="cat-text">${committee.name}</div>
                                    </a>
                                </div>`;
                        });
        
                        document.getElementById('committee-list').innerHTML = committeeListHtml;
                    }
                })
                .catch(error => console.error('Error fetching committee list:', error));
            }
        
            // Initialize both
            fetchMemberCards();
            fetchCommitteeList();
        </script>
